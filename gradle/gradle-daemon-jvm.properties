# Pin the Gradle daemon JVM to 21 (the version this project is built with,
# see mise.toml). detekt 1.23.8 runs its embedded Kotlin compiler in-process
# inside the daemon and calls JavaVersion.current(); on a newer JVM (e.g. 27)
# its dated IntelliJ parser throws "IllegalArgumentException: 27". Pinning the
# daemon to 21 keeps detekt (and the whole build) on a JDK it supports. The
# foojay resolver (settings.gradle.kts) auto-provisions 21 if it isn't local.
toolchainVendor=eclipse
toolchainVersion=21
