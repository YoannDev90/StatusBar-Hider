# Pin the Gradle daemon JVM to 21 (the version this project is built with,
# see mise.toml). detekt 1.23.8 runs its embedded Kotlin compiler in-process
# inside the daemon and calls JavaVersion.current(); on a newer JVM (e.g. 27)
# its dated IntelliJ parser throws "IllegalArgumentException: 27". Pinning the
# daemon to 21 keeps detekt (and the whole build) on a JDK it supports.
# `eclipse` is that JDK's vendor: Eclipse Temurin, the one mise installs and
# the one actions/setup-java installs in CI.
# This JVM must already be installed — Gradle picks the daemon JVM before any
# build script runs, so the foojay resolver in settings.gradle.kts cannot
# download it. That is why mise.toml pins `java = "21"`: without a local match
# the resolution fails with "No defined toolchain download url".
toolchainVendor=eclipse
toolchainVersion=21
