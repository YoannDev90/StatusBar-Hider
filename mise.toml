# Project toolchain — `mise install` then `mise run build`.
# AGP 8.5.2 requires Gradle >= 8.7; Kotlin 2.0.20 is fully tested on 8.8.
[tools]
java = "21"
gradle = "8.8.0"
android-sdk = "23.0"

[vars]
APK = "app/build/outputs/apk/release/app-release.apk"
APK_DEBUG = "app/build/outputs/apk/debug/app-debug.apk"

[tasks.build]
description = "Build signed release APK"
run = "gradle assembleRelease"

[tasks.debug]
description = "Build debug APK"
run = "gradle assembleDebug"

[tasks.lint]
description = "Run ktlint on Kotlin sources"
run = "ktlint 'app/src/main/**/*.kt'"

[tasks.install]
description = "Build + install release APK on device"
depends = ["build"]
run = "adb install -r {{vars.APK}}"

[tasks.install-debug]
description = "Build + install debug APK on device"
depends = ["debug"]
run = "adb install -r {{vars.APK_DEBUG}}"

[tasks.clean]
description = "Clean Gradle outputs"
run = "gradle clean"

[tasks.devices]
description = "List connected ADB devices"
run = "adb devices"

[tasks.logcat]
description = "Stream logcat for StatusBarHider"
run = "adb logcat -s StatusBarHider:* ActivityManager:*"

[tasks.show-in-drawer]
description = "Re-enable the launcher icon (reverse 'Hide from launcher')"
run = "adb shell am broadcast -a com.example.statusbarhider.SHOW_IN_DRAWER"

[tasks.uninstall]
description = "Uninstall the app from device"
run = "adb uninstall com.example.statusbarhider"
