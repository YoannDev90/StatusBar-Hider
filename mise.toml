# Project toolchain — `mise install` then `mise run build`.
# AGP 8.5.2 requires Gradle >= 8.7; Kotlin 2.0.20 is fully tested on 8.8.
[tools]
pre-commit = "latest"

[vars]
APK = "app/build/outputs/apk/release/app-release.apk"
APK_DEBUG = "app/build/outputs/apk/debug/app-debug.apk"

[tasks.build]
description = "Build signed release APK"
run = "./gradlew assembleRelease"

[tasks.debug]
description = "Build debug APK"
run = "./gradlew assembleDebug"

[tasks.format]
run = "ktlint --format"
description = "Run ktlint format"

[tasks.install]
description = "Build + install release APK on device"
depends = ["build"]
run = "adb install -r {{vars.APK}}"

[tasks.install-debug]
description = "Build + install debug APK on device"
depends = ["debug"]
run = "adb install -r {{vars.APK_DEBUG}}"

[tasks.clean]
description = "Clean Gradle outputs"
run = "./gradlew clean"

[tasks.devices]
description = "List connected ADB devices"
run = "adb devices"

[tasks.logcat]
description = "Stream logcat for StatusBarHider"
run = "adb logcat -s StatusBarHider:* ActivityManager:*"

[tasks.show-in-drawer]
description = "Re-enable the launcher icon (reverse 'Hide from launcher')"
run = "adb shell am broadcast -a dev.yoanndev90.statusbarhider.SHOW_IN_DRAWER -n dev.yoanndev90.statusbarhider/.ShowInDrawerReceiver"

[tasks.uninstall]
description = "Uninstall the app from device"
run = "adb uninstall dev.yoanndev90.statusbarhider"

[tasks.setup-hooks]
run = "pre-commit install && pre-commit install --hook-type commit-msg && mise use pre-commit"
description = "Install git hooks (pre-commit + commit-msg)"

[hooks]
postinstall = "mise setup-hooks"
