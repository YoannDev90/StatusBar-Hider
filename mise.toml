# Project tooling — `mise install` then `mise run build`.
# The Android SDK (ANDROID_HOME) is the one build requirement mise does not
# cover, see README.md.
# Versions are pinned, not "latest": everyone (and CI) must get the exact same
# formatter output, otherwise ktlint disagreements turn into commit noise.
[tools]
pre-commit = "4.6.2"
ktlint = "1.5.0"
# The build's JDK: detekt 1.23.8 throws on 27, so the Gradle daemon is pinned
# to 21 (see gradle/gradle-daemon-jvm.properties). Declaring it here puts an
# installed 21 on JAVA_HOME for every `mise run`, which is how Gradle finds a
# local match when it must start a *new* daemon: mise's install dir is not one
# of Gradle's auto-detected locations, so a 27 on JAVA_HOME left daemon
# resolution with no 21 and it tried to download one — which daemon-JVM
# criteria cannot do (foojay only runs inside an already-started daemon).
java = "21"

[vars]
APK = "app/build/outputs/apk/release/app-release.apk"
APK_DEBUG = "app/build/outputs/apk/debug/app-debug.apk"

[tasks.build]
description = "Build signed release APK"
run = "./gradlew assembleRelease"

[tasks.debug]
description = "Build debug APK"
run = "./gradlew assembleDebug"

[tasks.test]
description = "Run unit tests"
run = "./gradlew testDebugUnitTest"

[tasks.lint]
description = "Run Android lint"
run = "./gradlew lintDebug"

[tasks.ktlint]
description = "Check Kotlin formatting (no rewrite)"
run = "ktlint"

[tasks.check]
# CI runs exactly this (`mise run check`) before building the debug APK, so
# this task is the single source of truth for the quality gate.
description = "Quality gate CI runs: format, static analysis, tests, lint"
depends = ["ktlint"]
run = "./gradlew detekt testDebugUnitTest lintDebug"

[tasks.format]
run = "ktlint --format"
description = "Run ktlint format"

[tasks.install]
description = "Build + install release APK on device"
depends = ["build"]
run = "adb install -r {{vars.APK}}"

[tasks.install-debug]
description = "Build + install debug APK on device"
depends = ["debug"]
run = "adb install -r {{vars.APK_DEBUG}}"

[tasks.clean]
description = "Clean Gradle outputs"
run = "./gradlew clean"

[tasks.devices]
description = "List connected ADB devices"
run = "adb devices"

[tasks.logs]
description = "Live log stream for StatusBarHider (logstream TUI)"
run = "cargo run --quiet --manifest-path android-tools/logstream/Cargo.toml -- --package dev.yoanndev90.statusbarhider"

[tasks.uninstall]
description = "Uninstall the app from device"
run = "adb uninstall dev.yoanndev90.statusbarhider"

[tasks.setup-hooks]
run = "pre-commit install && pre-commit install --hook-type commit-msg && mise use pre-commit"
description = "Install git hooks (pre-commit + commit-msg)"

[hooks]
postinstall = "mise setup-hooks"
