# Project tooling — `mise install` then `mise run build`.
# Only git hooks and the formatter live here; the build itself needs a JDK 21
# and an Android SDK (ANDROID_HOME), see README.md.
[tools]
pre-commit = "latest"
ktlint = "latest"

[vars]
APK = "app/build/outputs/apk/release/app-release.apk"
APK_DEBUG = "app/build/outputs/apk/debug/app-debug.apk"

[tasks.build]
description = "Build signed release APK"
run = "./gradlew assembleRelease"

[tasks.debug]
description = "Build debug APK"
run = "./gradlew assembleDebug"

[tasks.format]
run = "ktlint --format"
description = "Run ktlint format"

[tasks.install]
description = "Build + install release APK on device"
depends = ["build"]
run = "adb install -r {{vars.APK}}"

[tasks.install-debug]
description = "Build + install debug APK on device"
depends = ["debug"]
run = "adb install -r {{vars.APK_DEBUG}}"

[tasks.clean]
description = "Clean Gradle outputs"
run = "./gradlew clean"

[tasks.devices]
description = "List connected ADB devices"
run = "adb devices"

[tasks.logs]
description = "Live log stream for StatusBarHider (logstream TUI)"
run = "cargo run --quiet --manifest-path tools/logstream/Cargo.toml -- --package dev.yoanndev90.statusbarhider"

[tasks.uninstall]
description = "Uninstall the app from device"
run = "adb uninstall dev.yoanndev90.statusbarhider"

[tasks.setup-hooks]
run = "pre-commit install && pre-commit install --hook-type commit-msg && mise use pre-commit"
description = "Install git hooks (pre-commit + commit-msg)"

[hooks]
postinstall = "mise setup-hooks"
