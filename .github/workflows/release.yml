name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # SHA pins + persist-credentials:false harden against zizmor's
      # unpinned-uses and artipacked. Dependabot keeps the pins fresh
      # (see dependabot.yml, github-actions ecosystem).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 21

      # cache-disabled: a tag-triggered publish must not read a Gradle cache an
      # untrusted ref could have poisoned (zizmor cache-poisoning).
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-disabled: true

      # The runner image ships an Android SDK, but not necessarily the
      # compileSdk platform / build-tools this project needs. AGP downloads
      # missing packages itself once the licenses are accepted.
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Decode keystore
        run: |
          mkdir -p keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore/statusbarhider.keystore
          echo "storeFile=keystore/statusbarhider.keystore" > keystore.properties
          echo "storePassword=${{ secrets.KEYSTORE_STORE_PASSWORD }}" >> keystore.properties
          echo "keyAlias=${{ secrets.KEYSTORE_KEY_ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.KEYSTORE_KEY_PASSWORD }}" >> keystore.properties

      - name: Read version from tag
        id: version
        # v1.2.3 -> name 1.2.3, code 1002003 (major*1e6 + minor*1e3 + patch,
        # the layout Android expects: each component must stay under 1000).
        run: |
          tag="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<< "$tag"
          echo "name=$tag" >> "$GITHUB_OUTPUT"
          echo "code=$(( ${major:-0} * 1000000 + ${minor:-0} * 1000 + ${patch:-0} ))" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Lint
        run: ./gradlew lintDebug

      # versionCode/versionName travel through env, not inline ${{ }} in the run
      # block: the tag name is attacker-controllable, so expanding it straight
      # into shell would be code injection (zizmor template-injection).
      - name: Build release APK
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: >
          ./gradlew assembleRelease
          -PversionCode=$VERSION_CODE
          -PversionName=$VERSION_NAME

      # gh CLI instead of action-gh-release (zizmor superfluous-actions): the
      # runner ships gh, and this drops a whole third-party action to pin.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" app/build/outputs/apk/release/app-release.apk --generate-notes
